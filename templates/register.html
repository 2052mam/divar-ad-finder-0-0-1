<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت‌نام | دیده‌بان دیوار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E4E9F2;font-family:Vazirmatn,Tahoma,sans-serif;color:#2C3347}
.box{background:#EDF1F8;padding:32px;border-radius:22px;width:min(400px,92vw);box-shadow:10px 10px 24px #AAB4C6,-10px -10px 24px #fff}
h1{margin:0 0 8px;font-size:1.4rem}
p{color:#707C8F;margin:0 0 18px;font-size:.9rem}
label{display:block;margin:12px 0 6px;font-size:.85rem;color:#707C8F}
input{width:100%;padding:12px;border:none;border-radius:12px;background:#EDF1F8;box-shadow:inset 4px 4px 9px #AAB4C6,inset -4px -4px 9px #fff;font-family:inherit;box-sizing:border-box}
button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:12px;background:linear-gradient(145deg,#6C5DD3,#5347B0);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.err{color:#C22448;font-size:.85rem;margin-top:10px}
.alt{text-align:center;margin-top:16px;font-size:.85rem;color:#707C8F}
.alt a{color:#6C5DD3;font-weight:700;text-decoration:none}
.note{background:#DEF6F1;color:#0C7E72;border-radius:10px;padding:10px 12px;font-size:.8rem;margin-top:14px}
</style>
</head>
<body>
<form class="box" method="post">
  <h1>ساخت حساب کاربری</h1>
  <p>یک حساب بساز و ۳ روز رایگان امتحان کن</p>
  <label>نام کاربری</label>
  <input name="username" autocomplete="username" required minlength="3">
  <label>رمز عبور</label>
  <input name="password" type="password" autocomplete="new-password" required minlength="6">
  <label>تکرار رمز عبور</label>
  <input name="password2" type="password" autocomplete="new-password" required minlength="6">
  <button type="submit">ثبت‌نام</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <div class="note">پس از ثبت‌نام ۳ روز دسترسی آزمایشی رایگان فعال می‌شود.</div>
  <div class="alt">حساب داری؟ <a href="/login">وارد شو</a></div>
</form>
</body>
</html>
